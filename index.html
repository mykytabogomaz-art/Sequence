<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Як заварити чай</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #3f7d5c;
    --accent-soft: #e3f0e8;
    --border: #ddd8cc;
    --wrong: #c0392b;
    --wrong-soft: #fbe5e2;
    --slot: #fbfaf7;
    --question: #2f5d8a;
    --question-soft: #e6eef7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 32px; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { min-width: 0; }
  @media (max-width: 600px) {
    .columns { grid-template-columns: 1fr; gap: 16px; }
    #waitBox, #leftTitle:not(.q) { display: none !important; }
  }
  h1 { font-size: 1.5em; margin: 0 0 6px; }
  .task { color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: 1em; margin: 0 0 8px; color: var(--muted); font-weight: 600; }

  .list { display: flex; flex-direction: column; gap: 8px; min-height: 56px; }
  .card {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 8px 14px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    font: inherit; color: inherit; text-align: left;
    cursor: pointer;
    transition: transform .1s, border-color .2s, background .2s;
  }
  #answer .card { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #answer .card .handle { margin-left: auto; flex: none; color: var(--muted); font-size: 1.3em; line-height: 1; }
  #answer .card.dragging {
    position: fixed; z-index: 10; margin: 0;
    cursor: grabbing; transition: none;
    box-shadow: 0 10px 24px rgba(0,0,0,.18);
    border-color: var(--accent);
  }
  .placeholder { border: 2px dashed var(--accent); border-radius: 12px; background: var(--slot); }
  #answer.correct .card { cursor: default; }
  #answer.correct .card .handle { visibility: hidden; }
  .card .num {
    flex: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .9em;
  }
  #answer.correct .card { background: var(--accent-soft); border-color: var(--accent); }
  #answer.stretch .card { flex: 1 1 auto; }
  #answer .card.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
  #answer .card.wrong .num { background: var(--wrong); }
  #waitBox {
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 20px; color: var(--muted); text-align: center; background: var(--slot);
  }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn {
    flex: 1 1 140px;
    padding: 14px; border-radius: 12px; border: none;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-main:disabled { opacity: .45; cursor: default; }
  .btn-second { background: var(--card); color: var(--text); border: 2px solid var(--border); }

  .msg {
    margin-top: 18px; padding: 14px; border-radius: 12px;
    font-weight: 600; text-align: center; display: none;
  }
  .msg.ok { display: block; background: var(--accent-soft); color: var(--accent); }
  .msg.bad { display: block; background: var(--wrong-soft); color: var(--wrong); }

  #quiz {
    display: none;
    flex-direction: column; justify-content: space-between; gap: 14px;
    padding: 16px;
    background: var(--card);
    border: 2px solid var(--question);
    border-radius: 14px;
  }
  #leftTitle.q { color: var(--question); }
  .q-item label { display: block; font-weight: 700; margin: 0 0 6px; }
  .q-item input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    border: 2px solid var(--border); border-radius: 10px;
    background: var(--slot); color: var(--text);
    outline: none;
  }
  .q-item input:focus { border-color: var(--question); background: #fff; }
  .q-item input.ok { border-color: var(--accent); background: var(--accent-soft); }
  .q-item input.bad { border-color: var(--wrong); background: var(--wrong-soft); }
</style>
</head>
<body>
<main>
  <h1>☕ Як заварити чай</h1>
  <p class="task">Речення стоять у неправильному порядку. Перетягни їх мишкою або пальцем, щоб розставити дії правильно: що робимо спочатку, що потім.</p>

  <div class="columns">
    <div class="col">
      <h2>Моя послідовність</h2>
      <div id="answer" class="list"></div>
    </div>
    <div class="col">
      <h2 id="leftTitle">Питання</h2>
      <div id="waitBox">Питання з'являться тут, коли всі речення стоятимуть правильно.</div>
      <section id="quiz"></section>
    </div>
  </div>

  <div class="buttons">
    <button id="check" class="btn btn-main">Перевірити</button>
  </div>

  <div id="feedback" class="msg"></div>
</main>

<script>
  const STEPS = {
    water:  "Налити воду в чайник.",
    on:     "Увімкнути чайник з водою.",
    pour:   "Налити гарячу воду в чашку.",
    bag:    "Покласти чайний пакетик у чашку з гарячою водою.",
    wait:   "Дочекатися, поки чай завариться.",
    sugar:  "Додати цукор у заварений чай.",
    stir:   "Перемішати чай з цукром ложкою."
  };
  // Єдиний правильний порядок
  const CHAIN = ["water", "on", "pour", "bag", "wait", "sugar", "stir"];

  // Відповіді беруться з послідовності, яку склала дитина
  const QUESTIONS = [
    { text: "Що потрібно зробити першим?",
      answer: o => o[0] },
    { text: "Що потрібно зробити останнім?",
      answer: o => o[o.length - 1] },
    { text: "Що потрібно зробити після того, як вода закипіла?",
      answer: o => o[o.indexOf("on") + 1] },
    { text: "Що потрібно зробити перед тим, як розмішувати чай ложкою?",
      answer: o => o[o.indexOf("stir") - 1] }
  ];

  const $ = id => document.getElementById(id);
  const answer = $("answer"), checkBtn = $("check");
  const leftTitle = $("leftTitle"), waitBox = $("waitBox");
  const feedback = $("feedback"), quiz = $("quiz");

  let answerOrder = [];
  let phase = "order";   // "order" → розставляємо, "questions" → відповідаємо, "done"
  let locked = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeCard(id, numbered, index) {
    const b = document.createElement("div");
    b.className = "card";
    b.dataset.id = id;
    b.innerHTML = `<span>${STEPS[id]}</span>` + (numbered ? '<span class="handle">⠿</span>' : "");
    return b;
  }

  function render() {
    answer.innerHTML = "";
    answerOrder.forEach((id, i) => {
      const c = makeCard(id, true, i);
      enableDrag(c);
      answer.appendChild(c);
    });
  }

  function renumber() {
    answer.querySelectorAll(".card .num").forEach((n, i) => n.textContent = i + 1);
  }

  // ---------- Перетягування (мишка і палець) ----------
  function enableDrag(card) {
    card.addEventListener("pointerdown", e => {
      if (locked || e.button > 0) return;
      e.preventDefault();
      const startY = e.clientY;
      let dragging = false, ph, offsetY, lastY = startY, scrollTimer = null;
      card.setPointerCapture(e.pointerId);

      function place(y) {
        card.style.top = (y - offsetY) + "px";
        const others = [...answer.querySelectorAll(".card:not(.dragging)")];
        const before = others.find(o => {
          const r = o.getBoundingClientRect();
          return y < r.top + r.height / 2;
        });
        if (before) answer.insertBefore(ph, before); else answer.appendChild(ph);
      }

      // Автопрокрутка біля краю екрана (на телефоні)
      function autoScroll() {
        const edge = 60;
        let dy = 0;
        if (lastY < edge) dy = -12;
        else if (lastY > window.innerHeight - edge) dy = 12;
        if (dy) { window.scrollBy(0, dy); place(lastY); }
      }

      const onMove = ev => {
        lastY = ev.clientY;
        if (!dragging) {
          if (Math.abs(ev.clientY - startY) < 5) return;
          dragging = true;
          clearFeedback();
          const rect = card.getBoundingClientRect();
          offsetY = startY - rect.top;
          ph = document.createElement("div");
          ph.className = "placeholder";
          ph.style.height = rect.height + "px";
          card.after(ph);
          card.style.width = rect.width + "px";
          card.style.left = rect.left + "px";
          card.classList.add("dragging");
          scrollTimer = setInterval(autoScroll, 30);
        }
        place(ev.clientY);
      };

      const onUp = () => {
        card.removeEventListener("pointermove", onMove);
        card.removeEventListener("pointerup", onUp);
        card.removeEventListener("pointercancel", onUp);
        clearInterval(scrollTimer);
        if (!dragging) return;
        ph.replaceWith(card);
        card.classList.remove("dragging");
        card.style.width = card.style.left = card.style.top = "";
        answerOrder = [...answer.querySelectorAll(".card")].map(c => c.dataset.id);
        renumber();
      };

      card.addEventListener("pointermove", onMove);
      card.addEventListener("pointerup", onUp);
      card.addEventListener("pointercancel", onUp);
    });
  }

  // Повертає множину неправильно розташованих речень
  function wrongIds(order) {
    const wrong = new Set();
    order.forEach((id, i) => { if (CHAIN[i] !== id) wrong.add(id); });
    return wrong;
  }
  function isCorrect(order) { return wrongIds(order).size === 0; }

  function clearFeedback() {
    feedback.className = "msg";
    feedback.textContent = "";
    answer.querySelectorAll(".card").forEach(c => c.classList.remove("wrong"));
  }

  // ---------- Відповіді ----------
  // Ключові слова кожної дії. Перевірка йде по черзі, перше збігання — це дія, яку написала дитина.
  // Так відповідь зараховується, навіть якщо вона написана коротко або з дрібною помилкою.
  const MATCH = [
    ["stir",  /переміш|розміш|мішат|ложк/],
    ["bag",   /пакет/],
    ["on",    /увімк|вмик|включ/],
    ["sugar", /цукор|цукр/],
    ["wait",  /чека|завар/],
    ["pour",  /чашк|горнят/],
    ["water", /чайник|вод|налит|налл/]
  ];
  function normalize(t) {
    return t.toLowerCase().replace(/['’ʼ`]/g, "").replace(/ё/g, "е").replace(/\s+/g, " ").trim();
  }
  function recognize(text) {
    const t = normalize(text);
    if (!t) return null;
    const hit = MATCH.find(([, re]) => re.test(t));
    return hit ? hit[0] : null;
  }

  function buildQuiz() {
    quiz.innerHTML = "";
    QUESTIONS.forEach((q, i) => {
      const item = document.createElement("div");
      item.className = "q-item";
      item.innerHTML = `<label for="a${i}">${i + 1}. ${q.text}</label>
        <input id="a${i}" type="text" autocomplete="off" spellcheck="false" placeholder="Напиши відповідь">`;
      const input = item.querySelector("input");
      input.addEventListener("input", () => { input.classList.remove("bad"); clearFeedback(); });
      input.addEventListener("keydown", e => { if (e.key === "Enter") checkBtn.click(); });
      quiz.appendChild(item);
    });
  }

  function checkAnswers() {
    let allOk = true, empty = false;
    QUESTIONS.forEach((q, i) => {
      const input = $("a" + i);
      if (input.classList.contains("ok")) return;
      if (!input.value.trim()) { empty = true; allOk = false; return; }
      const ok = recognize(input.value) === q.answer(answerOrder);
      input.classList.toggle("ok", ok);
      input.classList.toggle("bad", !ok);
      input.readOnly = ok;
      if (!ok) allOk = false;
    });
    if (allOk) {
      phase = "done";
      checkBtn.disabled = true;
      feedback.className = "msg ok";
      feedback.textContent = "🎉 Чудово! Ти відповів на всі питання! Тепер розкажи своїми словами, як заварити чай.";
    } else if (quiz.querySelector("input.bad")) {
      feedback.className = "msg bad";
      feedback.textContent = "Червоні відповіді неправильні. Подивись на свою послідовність і спробуй ще раз.";
    } else if (empty) {
      feedback.className = "msg bad";
      feedback.textContent = "Дай відповідь на всі питання.";
    }
  }

  // ---------- Висота: блок зліва (сірий / питання) = блок послідовності ----------
  function syncHeights() {
    const wasShown = quiz.style.display === "flex";
    quiz.style.minHeight = waitBox.style.minHeight = answer.style.minHeight = "";
    // міряємо блок питань (невидимим, якщо його ще не показано)
    if (!wasShown) { quiz.style.visibility = "hidden"; quiz.style.display = "flex"; waitBox.style.display = "none"; }
    const hq = quiz.offsetHeight;
    if (!wasShown) { quiz.style.display = "none"; quiz.style.visibility = ""; if (phase === "order") waitBox.style.display = ""; }
    answer.classList.add("stretch");
    const H = Math.max(hq, answer.offsetHeight);
    answer.style.minHeight = quiz.style.minHeight = waitBox.style.minHeight = H + "px";
  }
  window.addEventListener("resize", syncHeights);

  checkBtn.onclick = () => {
    if (phase === "questions") { checkAnswers(); return; }
    if (phase !== "order") return;
    const wrong = wrongIds(answerOrder);
    answer.querySelectorAll(".card").forEach(c => {
      c.classList.toggle("wrong", wrong.has(c.dataset.id));
    });
    if (wrong.size === 0) {
      phase = "questions";
      locked = true;
      answer.classList.add("correct");
      feedback.className = "msg ok";
      feedback.textContent = "🎉 Молодець! Усе правильно! Тепер дай відповіді на питання.";
      waitBox.style.display = "none";
      leftTitle.classList.add("q");
      quiz.style.display = "flex";
      checkBtn.textContent = "Перевірити відповіді";
      $("a0").focus({ preventScroll: true });
      quiz.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
      feedback.className = "msg bad";
      feedback.textContent = "Червоні речення стоять не на своєму місці. Перетягни їх і спробуй ще раз.";
    }
  };

  function start() {
    let order;
    do { order = shuffle(CHAIN); } while (wrongIds(order).size < 5); // добре перемішано
    answerOrder = order;
    phase = "order";
    locked = false;
    checkBtn.disabled = false;
    clearFeedback();
    render();
    buildQuiz();
    syncHeights();
  }

  start();
</script>
</body>
</html>
